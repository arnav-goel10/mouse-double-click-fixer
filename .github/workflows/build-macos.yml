name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build app and DMG
        run: bash installer/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleClickFixer-macos
          path: dist/DoubleClickFixer.dmg
