name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build app and DMG
        run: bash installer/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: DoubleClickFixer-macos
          path: dist/DoubleClickFixer.dmg
