name: CI

on:
  push:
    branches: [main, modern-ui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m compileall -q app run.py

  windows-hook:
    name: Windows hook end-to-end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Inject clicks through the real low-level hook
        run: python -m unittest tests.test_windows_hook -v
        env:
          DCF_E2E: "1"
      - name: Capture the real window
        run: python tools/screenshots.py screenshots --live
      - uses: actions/upload-artifact@v7
        with:
          name: windows-screenshots
          path: screenshots/

  windows-install:
    name: Windows install, quit and update end-to-end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build the exe and the installer
        shell: pwsh
        run: |
          .\installer\build_windows.ps1
          choco install innosetup --no-progress -y
          $version = (python -c "import app; print(app.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer\windows.iss"
      - name: Download the oldest installer still in use (0.2.6, before --quit)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.2.6 -p DoubleClickFixer-Setup.exe -D old
      - name: Install over a running copy, quit, update, uninstall
        shell: pwsh
        run: .\tools\windows_install_e2e.ps1 -OldSetup old\DoubleClickFixer-Setup.exe -NewSetup installer\Output\DoubleClickFixer-Setup.exe
