name: CI

on:
  push:
    branches: [main, modern-ui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m compileall -q app run.py

  windows-hook:
    name: Windows hook end-to-end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Inject clicks through the real low-level hook
        run: python -m unittest tests.test_windows_hook -v
        env:
          DCF_E2E: "1"
      - name: Capture the real window
        run: python tools/screenshots.py screenshots --live
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: screenshots/
