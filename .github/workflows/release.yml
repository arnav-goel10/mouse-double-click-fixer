name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows executable
        shell: pwsh
        run: .\installer\build_windows.ps1
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer\windows.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleClickFixer-windows
          path: |
            dist/DoubleClickFixer.exe
            installer/Output/DoubleClickFixer-Setup.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build macOS app and DMG
        run: bash installer/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleClickFixer-macos
          path: |
            dist/DoubleClickFixer.app
            dist/DoubleClickFixer.dmg

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/DoubleClickFixer-windows/DoubleClickFixer.exe
            release-assets/DoubleClickFixer-windows/DoubleClickFixer-Setup.exe
            release-assets/DoubleClickFixer-macos/DoubleClickFixer.dmg
