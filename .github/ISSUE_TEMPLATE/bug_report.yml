name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the General pane.
      placeholder: "0.2.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "macOS 27.0 / Windows 11 24H2"
  - type: input
    id: mouse
    attributes:
      label: Mouse model and filter window
      placeholder: "Logitech G502, 45 ms"
  - type: textarea
    id: logs
    attributes:
      label: Crash report or other details
      description: On macOS, crash reports are in ~/Library/Logs/DiagnosticReports/DoubleClickFixer-*.ips.
