name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        In the app, open General and choose Copy Diagnostics (Windows: Copy
        diagnostics) under Troubleshooting, then paste it here. It has the
        app version, your OS, the filter's state, your settings and the app's
        recent log, never your clicks. If the app won't open, give the app
        version and OS version instead.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the General pane, and at the top of the diagnostics.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: mouse
    attributes:
      label: Mouse model and filter window
      placeholder: "Logitech G502, 45 ms"
  - type: textarea
    id: logs
    attributes:
      label: Crash report or other details
      description: >-
        If the app crashed: on macOS, the newest
        ~/Library/Logs/DiagnosticReports/DoubleClickFixer-*.ips, and on either
        platform crash.log from the app's folder
        (~/Library/Application Support/DoubleClickFixer on macOS,
        %APPDATA%\DoubleClickFixer on Windows).
